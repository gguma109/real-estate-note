<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>통합 부동산 관리 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E3A8A',
                        accent: '#2563EB',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .hover-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hover-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.15);
        }
        
        .hover-card:active {
            transform: translateY(0) scale(0.98);
        }
        
        .bg-gradient-mesh {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 40% 20%, hsla(228,100%,74%,0.15) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.15) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,0.15) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,0.15) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,0.15) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,0.15) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-gradient-mesh min-h-screen font-sans text-gray-800 flex flex-col antialiased selection:bg-blue-200">

    <div class="flex-1 flex flex-col items-center justify-center p-6 max-w-lg mx-auto w-full relative z-10">
        
        <div class="mb-12 text-center animate-fade-in-down" style="animation: fadeInDown 0.8s ease-out;">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-lg mb-6 border border-gray-100">
                <span class="text-4xl">🏢</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight mb-3">
                부동산 통합 포털
            </h1>
            <p class="text-gray-500 font-medium">원하시는 업무 공간을 선택해주세요</p>
        </div>

        <div class="w-full space-y-5">
            <!-- 부동산 중개 버튼 -->
            <a href="/brokerage.html?v=3" onclick="localStorage.setItem('activeTab', 'rental')" class="block">
                <div class="hover-card glass-panel rounded-3xl p-6 relative overflow-hidden group cursor-pointer">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl -mr-10 -mt-10 transition-transform group-hover:scale-150 duration-500"></div>
                    
                    <div class="flex items-center gap-5 relative z-10">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white shadow-lg shadow-blue-500/30 shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h2 class="text-xl font-bold text-gray-900 mb-1">부동산 중개</h2>
                            <p class="text-sm text-gray-500 font-medium leading-snug">중개의뢰서 및 광고매물 관리</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                              <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                </div>
            </a>

            <!-- 주택 관리 버튼 -->
            <a href="/management.html?v=3" onclick="localStorage.setItem('activeTab', 'moveout')" class="block">
                <div class="hover-card glass-panel rounded-3xl p-6 relative overflow-hidden group cursor-pointer" style="animation-delay: 0.1s;">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl -mr-10 -mt-10 transition-transform group-hover:scale-150 duration-500"></div>
                    
                    <div class="flex items-center gap-5 relative z-10">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30 shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h2 class="text-xl font-bold text-gray-900 mb-1">주택 관리</h2>
                            <p class="text-sm text-gray-500 font-medium leading-snug">퇴실확인서 및 이사정산</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600 group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                              <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <button id="announcement-button" type="button" onclick="openAnnouncements()"
            class="mt-7 inline-flex items-center gap-2 rounded-full border border-blue-100 bg-white/80 px-4 py-2 text-xs font-bold text-blue-700 shadow-sm transition hover:bg-white hover:shadow-md">
            <span>📢 공지사항</span>
            <span id="current-version" class="rounded-full bg-blue-50 px-2 py-0.5 text-[10px] text-blue-600">v1.1.0</span>
            <span id="announcement-unread" class="hidden h-2 w-2 rounded-full bg-red-500" aria-label="새 공지"></span>
        </button>

        <div class="mt-12 text-center flex flex-col items-center gap-1.5">
            <div class="text-[11px] font-bold text-gray-400/80 tracking-wide uppercase">
                Created by GGUMA
            </div>
            <div class="text-[10px] font-semibold text-gray-400/60">
                <p>보안 연결됨 &middot; Cloudflare D1 Sync</p>
            </div>
        </div>
    </div>

    <div id="announcement-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/50 p-4"
        onclick="if (event.target === this) closeAnnouncements()">
        <section class="flex max-h-[85vh] w-full max-w-lg flex-col overflow-hidden rounded-3xl bg-white shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="announcement-title">
            <header class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
                <div>
                    <p class="text-[11px] font-black uppercase tracking-[0.2em] text-blue-500">Release notes</p>
                    <h2 id="announcement-title" class="mt-1 text-xl font-black text-gray-900">공지사항</h2>
                </div>
                <button type="button" onclick="closeAnnouncements()" class="rounded-full p-2 text-2xl font-bold leading-none text-gray-400 hover:bg-gray-100 hover:text-gray-700" aria-label="공지사항 닫기">&times;</button>
            </header>
            <div id="announcement-list" class="flex-1 space-y-4 overflow-y-auto bg-gray-50 p-4">
                <div class="py-10 text-center text-sm font-bold text-gray-400">공지사항을 불러오는 중입니다.</div>
            </div>
        </section>
    </div>

    <style>
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        let announcementData = null;

        function escapeAnnouncementHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function renderAnnouncements() {
            const list = document.getElementById('announcement-list');
            const announcements = announcementData?.announcements || [];
            if (!announcements.length) {
                list.innerHTML = '<div class="py-10 text-center text-sm font-bold text-gray-400">등록된 공지사항이 없습니다.</div>';
                return;
            }

            list.innerHTML = announcements.map((notice, index) => `
                <article class="rounded-2xl border ${index === 0 ? 'border-blue-200 bg-white shadow-sm' : 'border-gray-200 bg-white/80'} p-5">
                    <div class="mb-3 flex flex-wrap items-center gap-2">
                        <span class="rounded-full ${index === 0 ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'} px-2.5 py-1 text-[11px] font-black">v${escapeAnnouncementHtml(notice.version)}</span>
                        ${index === 0 ? '<span class="rounded-full bg-red-50 px-2 py-1 text-[10px] font-black text-red-500">NEW</span>' : ''}
                        <time class="ml-auto text-[11px] font-semibold text-gray-400">${escapeAnnouncementHtml(notice.date)}</time>
                    </div>
                    <h3 class="text-base font-black text-gray-900">${escapeAnnouncementHtml(notice.title)}</h3>
                    <p class="mt-2 text-sm leading-relaxed text-gray-500">${escapeAnnouncementHtml(notice.summary)}</p>
                    <ul class="mt-4 space-y-2">
                        ${(notice.changes || []).map(change => `<li class="flex gap-2 text-sm leading-relaxed text-gray-700"><span class="mt-0.5 text-blue-500">✓</span><span>${escapeAnnouncementHtml(change)}</span></li>`).join('')}
                    </ul>
                </article>
            `).join('');
        }

        async function loadAnnouncements() {
            try {
                const response = await fetch('/announcements.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('공지사항을 불러오지 못했습니다.');
                announcementData = await response.json();
                const version = announcementData.currentVersion || announcementData.announcements?.[0]?.version || '1.0.0';
                document.getElementById('current-version').textContent = `v${version}`;
                const seenVersion = localStorage.getItem('announcement_seen_version');
                document.getElementById('announcement-unread').classList.toggle('hidden', seenVersion === version);
                renderAnnouncements();
            } catch (error) {
                console.error(error);
                document.getElementById('announcement-list').innerHTML = '<div class="py-10 text-center text-sm font-bold text-red-400">공지사항을 불러오지 못했습니다.</div>';
            }
        }

        function openAnnouncements() {
            const modal = document.getElementById('announcement-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            const version = announcementData?.currentVersion;
            if (version) {
                localStorage.setItem('announcement_seen_version', version);
                document.getElementById('announcement-unread').classList.add('hidden');
            }
        }

        function closeAnnouncements() {
            const modal = document.getElementById('announcement-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeAnnouncements();
        });
        loadAnnouncements();
    </script>
</body>
</html>
